services:
  dubbing-studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dubbing-studio:latest
    container_name: dubbing-studio
    ports:
      - "8765:8765"
    volumes:
      # Finished videos appear here on your computer.
      - ./output:/output
      # Downloaded AI models are cached here so they download only once.
      - dubbing-models:/data
    environment:
      # Point at an Ollama running on the host, if there is one.
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  dubbing-models:
